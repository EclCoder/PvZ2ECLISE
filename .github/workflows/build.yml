name: Download ECL Beta APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Get MediaFire direct link
        run: |
          python3 <<'PY'
          import requests
          import re
          import html

          page_url = "https://www.mediafire.com/file/xz9p22me8e2ipbo/ECL_BETA_60FPS.apk/file"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/139.0 Safari/537.36"
              )
          }

          response = requests.get(
              page_url,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          page = html.unescape(response.text)

          patterns = [
              r'https://download[^"\'\\ ]+',
              r'https:\\/\\/download[^"\' ]+',
          ]

          direct_url = None

          for pattern in patterns:
              matches = re.findall(pattern, page)

              if matches:
                  direct_url = matches[0]
                  direct_url = direct_url.replace("\\/", "/")
                  break

          if not direct_url:
              print("Không tìm thấy direct download URL.")
              print("HTTP status:", response.status_code)
              print("Page size:", len(page))
              raise SystemExit(1)

          print("Direct URL:")
          print(direct_url)

          with open("mediafire_url.txt", "w") as f:
              f.write(direct_url)
          PY

      - name: Download APK
        run: |
          URL="$(cat mediafire_url.txt)"

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o ECL_BETA_60FPS.apk

          ls -lh ECL_BETA_60FPS.apk
          file ECL_BETA_60FPS.apk

      - name: Upload APK to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.9 \
            ECL_BETA_60FPS.apk \
            --repo "${{ github.repository }}"